server {
    listen 80;
    server_name xiaobibi.21ido.com www.xiaobibi.21ido.com;
    return 308 https://xiaobibi.21ido.com$request_uri;
}

server {
    listen 443 ssl;
    server_name xiaobibi.21ido.com www.xiaobibi.21ido.com;
    ssl_certificate /etc/nginx/ssl/xiaobibi.21ido.com/xiaobibi.21ido.com.pem;
    ssl_certificate_key /etc/nginx/ssl/xiaobibi.21ido.com/xiaobibi.21ido.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    root /var/www/xiaobibi;
    index index.html;
    location ^~ /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
